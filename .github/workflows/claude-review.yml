name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    name: Claude auto-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a change to LicenceBackend, a .NET 9 / PostgreSQL licence server. The system signs licence-verification responses with ES256, hashes licence keys + HWIDs as HMAC-SHA256 with a rotatable pepper, issues session JWTs + refresh tokens, and exposes admin endpoints behind role-based auth. The threat model assumes sophisticated attackers attaching debuggers to clients; the server must remain authoritative and failure modes on `POST /licences/verify` must stay vague.

            Review the diff with focus on:
            - Correctness and bugs (off-by-ones, null handling, transaction boundaries, race conditions).
            - Security: timing leaks, missing rate limiting, descriptive failures on `/licences/verify`, IP-allowlist bypasses, JWT validation drift, secret-handling regressions.
            - Conformance to existing patterns (Dapper repos, options validation with `ValidateOnStart`, `[EnableRateLimiting]` on admin controllers, `CryptographicOperations.FixedTimeEquals` for HMAC compares).
            - Test coverage: any new behaviour should have an integration test under `LicenceBackend.Tests/` or a unit test under `LicenceBackend.Tests.Unit/`.
            - Migrations: new SQL must live under `migrations/NNN_short_description.sql`, forward-only.

            Use inline comments via `mcp__github_inline_comment__create_inline_comment` for specific code issues. Use `gh pr comment` for an overall summary. Do not approve or request changes — leave that to the human reviewer. If the diff is small or trivially safe, post a one-line summary saying so rather than fabricating issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
